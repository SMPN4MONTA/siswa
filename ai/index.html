<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asisten Sekolah - SMPN 4 Monta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="ai.css">
</head>
<body class="bg-[#0d0d0f] text-gray-100 min-h-screen flex flex-col items-center justify-between p-6">
    <div class="w-full max-w-4xl flex justify-between items-center py-4 border-b border-[#BF953F]/20">
        <div class="flex items-center gap-3">
            <a href="../index.html" class="text-[#BF953F] hover:text-white text-sm font-bold uppercase tracking-wider">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Aplikasi
            </a>
        </div>
        <h1 class="text-sm font-black font-luxury tracking-widest uppercase text-transparent bg-clip-text bg-gradient-to-r from-[#BF953F] to-[#FCF6BA]">AI Asisten Sekolah</h1>
    </div>

    <main class="w-full max-w-2xl flex flex-col items-center text-center my-auto space-y-8">
        <div class="relative">
            <div class="w-32 h-32 rounded-full bg-gradient-to-b from-[#BF953F]/20 to-transparent flex items-center justify-center border border-[#BF953F]/40 shadow-2xl pulse-gold mx-auto">
                <i class="fa-solid fa-robot text-5xl text-[#BF953F]"></i>
            </div>
        </div>

        <div class="space-y-3">
            <h2 id="ai-status-title" class="text-2xl font-black font-luxury uppercase tracking-wider text-white">AI Asisten Sekolah</h2>
            <p id="ai-response-text" class="text-gray-300 text-base max-w-lg mx-auto font-medium">"Selamat datang, Pak. Ada yang bisa saya bantu?"</p>
        </div>

        <div class="flex flex-col items-center justify-center space-y-3">
            <button id="mic-toggle-btn" onclick="toggleVoiceAssistant()" class="w-16 h-16 rounded-full bg-gradient-to-r from-[#BF953F] to-[#AA7C11] text-black text-xl flex items-center justify-center shadow-lg active-scale transition-all">
                <i id="mic-icon" class="fa-solid fa-microphone"></i>
            </button>
            <span id="mic-label" class="text-xs text-[#BF953F] font-bold uppercase tracking-widest">Mendengarkan suara otomatis...</span>
        </div>

        <div id="ai-analytics-matrix" class="w-full grid grid-cols-3 gap-4 p-5 rounded-2xl bg-[#16161a] border border-[#BF953F]/20 text-center">
            <div>
                <p class="text-[10px] text-gray-400 uppercase font-bold">Guru Hadir</p>
                <h3 id="matrix-hadir" class="text-xl font-black text-emerald-400">0</h3>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 uppercase font-bold">Terlambat</p>
                <h3 id="matrix-terlambat" class="text-xl font-black text-amber-400">0</h3>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 uppercase font-bold">Tidak Hadir</p>
                <h3 id="matrix-tidak-hadir" class="text-xl font-black text-rose-400">0</h3>
            </div>
        </div>

        <div id="chart-container-wrapper" class="w-full bg-[#16161a] p-5 rounded-2xl border border-[#BF953F]/20 hidden">
            <canvas id="aiDynamicChart"></canvas>
        </div>
    </main>

    <footer class="text-[10px] text-gray-500 uppercase tracking-widest">
        SMP Negeri 4 Monta • Didukung oleh Gemma 3 4B & Ollama
    </footer>

    <script src="ai.js"></script>
</body>
</html>
